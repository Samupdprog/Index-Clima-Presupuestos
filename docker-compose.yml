name: ${INSTANCE_SLUG:-quotes}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s

  migrate:
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INSTALLATION_SLUG: ${INSTALLATION_SLUG:-demo}
      INSTALLATION_NAME: ${INSTALLATION_NAME:-Demo Company}
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      HOST: 0.0.0.0
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL}
      INSTALLATION_ID: ${INSTALLATION_ID}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      FEATURE_HOLDED: ${FEATURE_HOLDED:-false}
      HOLDED_API_KEY: ${HOLDED_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    networks:
      - private
      - egress
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      HOST: 0.0.0.0
      PORT: "4002"
      DATABASE_URL: ${DATABASE_URL}
      HOLDED_API_KEY: ${HOLDED_API_KEY:-}
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-4002}:4002"
    networks:
      - private
      - egress
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      INTERNAL_API_URL: http://api:4000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - private
      - public
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  mcp:
    build:
      context: .
      dockerfile: infra/docker/mcp.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      HOST: 0.0.0.0
      PORT: "4001"
      MCP_HOST: ${MCP_HOST}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-disabled}
      MCP_REQUIRED_SCOPES: ${MCP_REQUIRED_SCOPES:-}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      INTERNAL_API_URL: http://api:4000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    ports:
      - "127.0.0.1:${MCP_PORT:-4001}:4001"
    networks:
      - private
      - public
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

networks:
  private:
    name: ${INSTANCE_SLUG:-quotes}-private
    driver: bridge
    internal: true

  public:
    name: ${INSTANCE_SLUG:-quotes}-public

  egress:
    name: ${INSTANCE_SLUG:-quotes}-egress

volumes:
  postgres_data:
    name: ${INSTANCE_SLUG:-quotes}-postgres-data
