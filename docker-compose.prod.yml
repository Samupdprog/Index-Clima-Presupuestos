services:
  web:
    environment:
      APP_ACCESS_USERNAME: ${APP_ACCESS_USERNAME:-index-clima}
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:?APP_ACCESS_PASSWORD must be set for public deployment}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${INSTANCE_SLUG}-web.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.${INSTANCE_SLUG}-web.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_SLUG}-web.tls=true"
      - "traefik.http.routers.${INSTANCE_SLUG}-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.${INSTANCE_SLUG}-web.loadbalancer.server.port=3000"

  mcp:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${INSTANCE_SLUG}-mcp.rule=Host(`${MCP_HOST}`)"
      - "traefik.http.routers.${INSTANCE_SLUG}-mcp.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_SLUG}-mcp.tls=true"
      - "traefik.http.routers.${INSTANCE_SLUG}-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.${INSTANCE_SLUG}-mcp.loadbalancer.server.port=4001"

  oauth:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      # Mismo host que el MCP: el Authorization Server atiende solo /oauth/* y su metadata RFC 8414 / OIDC.
      - "traefik.http.routers.${INSTANCE_SLUG}-oauth.rule=Host(`${MCP_HOST}`) && (PathPrefix(`/oauth/`) || Path(`/.well-known/oauth-authorization-server`) || Path(`/.well-known/openid-configuration`))"
      - "traefik.http.routers.${INSTANCE_SLUG}-oauth.priority=100"
      - "traefik.http.routers.${INSTANCE_SLUG}-oauth.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_SLUG}-oauth.tls=true"
      - "traefik.http.routers.${INSTANCE_SLUG}-oauth.tls.certresolver=letsencrypt"
      - "traefik.http.services.${INSTANCE_SLUG}-oauth.loadbalancer.server.port=4003"

networks:
  public:
    name: ${TRAEFIK_NETWORK}
    external: true
